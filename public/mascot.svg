<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" fill="none">
  <!-- Body - slightly wobbly blob shape -->
  <path d="M100 30 C62 28 38 52 34 80 C30 108 28 130 32 158 C36 186 52 210 72 222 C84 230 100 234 116 228 C136 220 158 200 164 172 C170 144 168 110 162 82 C156 54 138 32 100 30 Z"
    fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"
    style="paint-order: stroke"/>

  <!-- Left eye -->
  <ellipse cx="78" cy="110" rx="9" ry="10" fill="#1a1a1a"/>
  <circle cx="75" cy="107" r="3" fill="#f4f1ea"/>

  <!-- Right eye -->
  <ellipse cx="122" cy="110" rx="9" ry="10" fill="#1a1a1a"/>
  <circle cx="119" cy="107" r="3" fill="#f4f1ea"/>

  <!-- Mouth - small wobbly line -->
  <path d="M88 140 C94 146 106 146 112 140" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Left ear / horn -->
  <path d="M62 50 C52 28 46 16 54 8 C62 0 72 12 72 32" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right ear / horn -->
  <path d="M138 50 C148 28 154 16 146 8 C138 0 128 12 128 32" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left arm -->
  <path d="M38 140 C18 138 6 148 8 162 C10 174 24 178 38 168" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arm -->
  <path d="M162 140 C182 138 194 148 192 162 C190 174 176 178 162 168" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Left leg -->
  <path d="M76 222 C72 234 68 248 72 256 C76 260 86 258 88 248 C90 238 88 228 84 222" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right leg -->
  <path d="M124 222 C128 234 132 248 128 256 C124 260 114 258 112 248 C110 238 112 228 116 222" fill="#f4f1ea" stroke="#1a1a1a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Little cross / stitch detail on chest -->
  <line x1="96" y1="168" x2="104" y2="176" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
  <line x1="104" y1="168" x2="96" y2="176" stroke="#1a1a1a" stroke-width="2" stroke-linecap="round"/>
</svg>
